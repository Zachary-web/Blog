# 激活 dev 环境
spring:
  profiles:
    active: dev

  # 数据库连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://112.126.58.134:3306/zblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: zblog
    password: Admin@123
    # 密码----------------------
    # url: jdbc:mysql://localhost:3306/zblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    # username: root
    # password: Admin@123
    # password: 123456

  # Redis 缓存配置 - 单机模式
  redis:
    host: 127.0.0.1
    password: ""
    port: 6379
    database: 0
    timeout: 10000ms

  # 邮件配置 - 用于评论回复等邮件通知功能
  # 需要配置正确的邮件服务器信息，搜索 "spring mail 配置" 获取帮助
  mail:
    host: smtp.mxhichina.com
    port: 465
    username: admin@example.com
    password: "123456"
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
          ssl:
            enable: true

  # 模板引擎配置 - 开发环境关闭缓存
  thymeleaf:
    cache: false

  # 开发工具配置 - 热重启功能
  devtools:
    restart:
      enabled: true

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# 服务器端口配置
server:
  port: 8090
  # Session 超时时间配置
  servlet:
    session:
      timeout: 30m
  # Nginx 代理配置
  # servlet:
  #   context-path: /api

# 博客名称
blog:
  name: "Zachary's Blog"
  # 博客 API 接口地址 - 生产环境 URL https://api.naccl.top/blog
  api: http://localhost:${server.port}
  # 博客后台管理系统地址 - 生产环境 URL https://admin.naccl.top
  cms: http://localhost:8080
  # 博客前台展示地址 - 生产环境 URL https://naccl.top
  view: http://localhost:8081
  # 服务器端----------------------
  # api: http://112.126.58.134:8090
  # cms: http://112.126.58.134:8080
  # view: http://112.126.58.134:8081

# MyBatis 映射配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    root: info
    top.naccl: debug
  # 日志文件路径
  file: /opt/zblog/log/blog-dev.log

# JWT Token 配置
# 1000 * 60 * 60 * 24 * 3 = 3 天 token 过期时间
token:
  expireTime: 259200000
  # JWT 密钥 - 使用 64 位 base64 编码的随机字符串作为密钥
  secretKey: "2x0+HflInjRqDTu6wucLgI4sR45TKs77mF8sx/P4GS3g4gR+q80GpdkVXmsMAlknN7pJvVIkJV/dyDBJfTt9mQ=="

# 评论通知通道配置: Telegram=tg 邮件=mail (支持多种通知方式，用逗号分隔)
comment:
  notify:
    channel: mail
  # 评论功能默认开启状态
  default-open: true

# Telegram Bot API 基础地址
tg:
  bot:
    api: https://api.telegram.org/bot
    # Telegram Bot Token - 需要通过 @BotFather 获取
    token: "1234567890:qwertyuiopasdfghjklzxcvbnm"
    # 聊天 ID - 接收通知的聊天 ID
    chat-id: "1234567890"
    # 是否使用代理
    use-proxy: false
    # 是否使用反向代理
    use-reverse-proxy: true
    # 反向代理 URL - 用于绕过网络限制访问 Telegram API
    reverse-proxy-url: https://tg-api-open.naccl.workers.dev

# HTTP 代理服务器配置 (主要用于 Telegram 通知)
http:
  proxy:
    server:
      host: 127.0.0.1
      port: 7890
      timeout: 10000

# 文件上传通道配置: 本地存储:local GitHub:github 又拍云:upyun
upload:
  channel: local
  # 本地文件上传配置
  file:
    path: "D:/upload"
    access-path: /image/**
    resources-locations: "file:${upload.file.path}"
  # GitHub 图床配置
  github:
    token: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    username: Zachary
    repos: blog-resource
    repos-path: /comment/avatar
  # 又拍云配置 - 参考文档: https://help.upyun.com/knowledge-base/quick_start/
  upyun:
    bucket-name: zblog
    username: zachary
    password: "xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    path: /comment/avatar
    domain: https://cdn.example.com
